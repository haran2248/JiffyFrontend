plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    dartDefines = dartDefines + project.property('dart-defines')
        .split(',')
        .collectEntries { entry ->
            try {
                def decoded = new String(entry.decodeBase64(), 'UTF-8')
                def pair = decoded.split('=', 2)
                [(pair[0]): pair.length > 1 ? pair[1] : '']
            } catch (Exception e) {
                [:]
            }
        }
}

def metaAppId = dartDefines['META_APP_ID'] ?: System.getenv('META_APP_ID') ?: '2253348865235149'
def metaClientToken = dartDefines['META_CLIENT_TOKEN'] ?: System.getenv('META_CLIENT_TOKEN') ?: '0dca8a67d7d3ef293a63dd7a8678e433'
def metaDisplayName = dartDefines['META_DISPLAY_NAME'] ?: System.getenv('META_DISPLAY_NAME') ?: 'jiffy'

android {
    namespace = "com.jiffydating.app"
    compileSdk = 36
    ndkVersion = "28.0.13004108"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.jiffydating.app"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = 56
        versionName = "1.0.56"
        multiDexEnabled true

        resValue "string", "facebook_app_id", metaAppId
        resValue "string", "facebook_client_token", metaClientToken
        resValue "string", "facebook_display_name", metaDisplayName
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    signingConfigs {
        release {
            def keyProperties = new Properties()
            def keyFile = file('D:/Everything swish/SwishFrontend/SwishFrontend/key.properties')
            if (keyFile.exists()) {
                keyProperties.load(new FileInputStream(keyFile))
                storeFile file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            } else {
                throw new RuntimeException("No key properties file provided!")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.android.installreferrer:installreferrer:2.2'
}

